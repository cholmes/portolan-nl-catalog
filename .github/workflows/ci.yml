name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # test_stac_valid.py SKIPs without this, so CI is where it is enforced.
      - name: Install stac-check (STAC validation)
        run: python -m pip install stac-check

      - name: Run catalog tests
        run: |
          python3 tests/test_publish.py
          python3 tests/test_links.py
          python3 tests/test_git_ext.py
          python3 tests/test_thumbnails.py
          python3 tests/test_generators.py
          python3 tests/test_stac_valid.py

      # No release contains spec PRs #97 and #116 yet, so rashid is built from
      # the two companion PR branches. This step tracks unmerged upstream work
      # and can break when those branches move: that is the accepted cost of
      # targeting the spec ahead of its release.
      - name: Build rashid with spec PRs #97 and #116
        run: bash tools/portolan/build_rashid.sh "$HOME/rashid-venv"

      - name: Portolan conformance
        env:
          RASHID: /home/runner/rashid-venv/bin/rashid
          PORTOLAN_STRICT: "1"
        run: python3 tests/test_portolan_conformance.py
