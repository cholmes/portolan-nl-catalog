name: Docs checks

# Runs the documented queries and the row-count claim checks against the
# published catalog (tests/test_docs_queries.py). The PR gates check only the
# committed metadata, so this is what catches drift between the docs and the
# live bucket. Weekly, plus on demand.

on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-docs:
    runs-on: ubuntu-latest
    # The cross-year brp scans read tens of millions of rows over HTTP. The
    # blocks run one at a time, because a concurrent run truncates reads from
    # the bucket. A full sequential run measures ~40 minutes.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install duckdb
        run: python -m pip install duckdb==1.5.3

      - name: Check table:columns against the published parquet
        env:
          PORTOLAN_LIVE: "1"
        run: python3 tests/test_published_schema.py

      - name: Run the documented queries against the published catalog
        env:
          PORTOLAN_LIVE: "1"
        run: python3 tests/test_docs_queries.py
