name: Docs checks

# Runs the documented queries and the row-count claim checks against the
# published catalog (tests/test_docs_queries.py). The PR gates check only the
# committed metadata, so this is what catches drift between the docs and the
# live bucket. Weekly, plus on demand.
#
# Note: until the v0.3 metadata publishes to Source Cooperative, the
# row-count checks compare against the currently published (v0.1) parquet,
# so a red run before that publish is expected.

on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-docs:
    runs-on: ubuntu-latest
    # The cross-year brp scans read tens of millions of rows over HTTP; a
    # full run measures ~25 minutes, so the 20-minute default is too short.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install duckdb
        run: python -m pip install duckdb==1.4.2

      - name: Run the documented queries against the published catalog
        env:
          PORTOLAN_LIVE: "1"
        run: python3 tests/test_docs_queries.py
