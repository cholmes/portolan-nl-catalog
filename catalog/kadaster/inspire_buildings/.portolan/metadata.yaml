processing_notes: >
  INSPIRE-harmonized buildings from BAG, downloaded via PDOK WFS
  (https://service.pdok.nl/kadaster/bu/wfs/v1_0) using gpio extract wfs
  in a tiled grid. Tiles merged with DuckDB, then optimized with gpio
  (Hilbert sort + bbox covering columns). Original GML.gz from PDOK ATOM
  download service included as additional asset.
